html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
header{background:var(--hd);color:#fff;padding:10px 16px;flex:none}

.q{text-align:right;font-weight:700;font-size:20px;line-height:1.1}.q small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin:2px 4px 0 0;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}

input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
.btn{border:0;background:var(--pr);color:var(--pt);font:inherit;font-weight:700;border-radius:10px;padding:11px 14px;min-height:44px}
.btn.s{background:var(--sf);color:var(--pr);border:1px solid var(--pr)}
.btn.d{background:var(--rd);color:#fff}
.btn.w{width:100%}.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid .card{text-align:center;margin:0;padding:10px 4px}.grid b{font-size:26px;display:block;line-height:1.2}.grid span{font-size:12px;color:var(--mu)}
.step{display:flex;margin:10px 0 2px}.step div{flex:1;text-align:center;font-size:11px;color:var(--mu);position:relative}
.step div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--ln);margin:0 auto 4px;position:relative;z-index:1}
.step div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--ln)}
.step div:first-child:after{display:none}
.step .dn{color:var(--tx)}.step .dn:before,.step .dn:after{background:var(--pr)}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:20px}
.stp input{width:64px;text-align:center}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.sh>div{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#vid{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}

.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.mu{color:var(--mu);font-size:13px}
.tbl{overflow-x:auto}
.sk{position:sticky;top:0;z-index:5;background:var(--bg);margin:-14px -14px 8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
#cl{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sf)}
.rc{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:56px;border-bottom:1px solid var(--ln);cursor:pointer}
.rc:last-child{border-bottom:0}.rc.r{background:var(--rb)}
.rc .dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.g{background:var(--gn)}.dot.y{background:#e5a50a}.dot.r{background:var(--rd)}
.rc .nm{flex:1;min-width:0;line-height:1.35}.rc .nm b{display:block;font-weight:500}.rc .sub{font-size:12px;color:var(--mu);margin-top:1px}.rc .sub .tag{font-size:11px;padding:0 6px;margin:0 0 0 6px}
.rc .qt{flex:none;text-align:right;line-height:1.15}.rc .qt b{display:block;font-size:20px}.rc .qt small{font-size:11px;color:var(--mu);white-space:nowrap}
.qt.g b{color:var(--gn)}.qt.y b{color:var(--am)}.qt.r b{color:var(--rd)}
.it.ok{border-left-color:var(--gn)}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.qk button{flex:1;min-width:64px;min-height:48px;border:1px solid var(--pr);background:var(--sf);color:var(--pr);font:inherit;font-weight:700;border-radius:10px}
.stp button{width:52px;height:52px;font-size:24px}.stp input{width:84px;height:52px;font-size:20px;font-weight:700}
.btn{min-height:52px}.chip{min-height:40px}nav button{min-height:64px}
button:active{transform:scale(.97)}
@media(min-width:768px){body{font-size:17px}main{padding:18px 28px 104px}main>*{max-width:1000px;margin-left:auto;margin-right:auto}#ls{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.cg{grid-template-columns:repeat(5,1fr)}.cat{min-height:100px;font-size:14px}.sh{align-items:center;justify-content:center}.sh>div{max-width:560px;border-radius:18px}}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.cat{position:relative;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 4px 8px;font:inherit;font-size:12px;line-height:1.3;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{font-style:normal;font-size:28px;line-height:1}
.cat.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}
.cat em{position:absolute;top:4px;right:4px;background:var(--rd);color:#fff;font-style:normal;font-size:11px;min-width:18px;line-height:18px;border-radius:9px}
.pw{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--ln);background:var(--ab);color:var(--tx)}
.pw.up{background:var(--gb)}.pw>span{flex:1;line-height:1.35}.pw .btn{min-height:40px;padding:8px 14px;white-space:nowrap}.pw .x{border:0;background:none;color:var(--mu);font-size:20px;min-width:36px;min-height:40px}

<script>
/* ===== นำเข้ารายการ จากไฟล์ / รูป / กล้อง ===== */
let IMP=[];
const loadJS=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('load'));document.head.appendChild(e)});
function impParse(txt,ocr){
 if(ocr)txt=txt.replace(/([\u0E00-\u0E7F])[ \t]+(?=[\u0E00-\u0E7F])/g,'$1');
 const L=txt.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return[];
 const d=L[0].includes('\t')?'\t':L[0].includes('|')?'|':L[0].includes(',')?',':null;
 const H={name:/ชื่อ|รายการ|name|item/i,code:/รหัส|code|sku/i,unit:/หน่วย|unit/i,cat:/หมวด|cat/i,min:/^min|ต่ำ/i,max:/^max|สูง/i,qty:/จำนวน|คงเหลือ|qty|stock/i};
 let map=null,st=0;
 if(d){const m={};L[0].split(d).forEach((x,k)=>{x=x.trim();for(const key in H)if(m[key]==null&&H[key].test(x)){m[key]=k;break}});if(m.name!=null){map=m;st=1}}
 const seen=new Set(),out=[];
 for(const l of L.slice(st)){
  const r={name:'',code:'',unit:'',cat:'',min:'',max:'',qty:''};
  if(d){const c=l.split(d).map(x=>x.trim().replace(/^"|"$/g,''));if(map){for(const k in map)r[k]=c[map[k]]||''}else{r.name=c[0]||'';r.unit=c[1]||''}}
  else r.name=l.replace(/^[\-–•*·●○▪■□✓✔]+\s*/,'').replace(/^\d{1,3}\s*[.)\]]\s*/,'');
  r.name=clean(r.name).replace(/\s{2,}/g,' ');r.code=clean(r.code).toUpperCase();r.unit=clean(r.unit);r.cat=clean(r.cat);
  if(r.name.length<2||!/[\u0E00-\u0E7Fa-zA-Z0-9]/.test(r.name))continue;
  const k=r.name.toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(r)}
 return out}
function impCat(v){v=(v||'').trim();if(!v)return'';const c=S.cats.find(c=>c.n===v||String(c.num)===v||c.n.includes(v)||v.includes(c.n));return c?c.n:''}
function impOpen(rows,src){
 if(!rows.length){closeSh();return toast('ไม่พบรายการที่นำเข้าได้')}
 const dc=MC!=='ทั้งหมด'?MC:S.cats[0].n,have=new Set(S.items.map(i=>i.name.toLowerCase()));
 IMP=rows.map(r=>({...r,dup:have.has(r.name.toLowerCase()),cat:impCat(r.cat)||dc}));IMP.forEach(r=>r.on=!r.dup);impShow(src)}
function impShow(src){
 {const t=$('#toast');if(t)t.style.display='none'}
 const co=c=>S.cats.map(x=>`<option ${x.n===c?'selected':''}>${x.n}</option>`).join('');
 sheet(`<h2>📥 ตรวจรายการก่อนเพิ่ม</h2><p class="mu">พบ ${IMP.length} รายการ จาก${src} · แก้ไขหรือเอาเครื่องหมายถูกออกได้</p>
 <div class="row" style="margin-bottom:10px"><select id="ica" style="flex:1">${co('')}</select><button class="chip" onclick="IMP.forEach(r=>r.cat=$('#ica').value);impShow('${src}')">ตั้งหมวดทุกรายการ</button></div>
 ${IMP.map((r,k)=>`<div class="card" style="padding:10px"><div class="row"><input type="checkbox" ${r.on?'checked':''} style="width:24px;height:24px;flex:none" onchange="IMP[${k}].on=this.checked;impCnt()"><input value="${r.name}" oninput="IMP[${k}].name=clean(this.value)"></div>${r.dup?'<div class="mu" style="margin:4px 0 0 32px">⚠️ มีชื่อนี้อยู่แล้ว</div>':''}
 <div class="row" style="margin-top:6px"><select style="flex:1" onchange="IMP[${k}].cat=this.value">${co(r.cat)}</select><input placeholder="หน่วย" value="${r.unit}" style="width:92px" oninput="IMP[${k}].unit=clean(this.value)"></div>
 <div class="row" style="margin-top:6px"><input placeholder="รหัส (อัตโนมัติ)" value="${r.code}" oninput="IMP[${k}].code=clean(this.value).toUpperCase()"><input type="number" inputmode="numeric" placeholder="Min" value="${r.min}" style="width:76px" oninput="IMP[${k}].min=this.value"><input type="number" inputmode="numeric" placeholder="Max" value="${r.max}" style="width:76px" oninput="IMP[${k}].max=this.value"></div></div>`).join('')}
 <button class="btn w" id="impb" onclick="impSave()"></button>`);impCnt()}
function impCnt(){const n=IMP.filter(r=>r.on).length,b=$('#impb');if(b){b.textContent=`➕ เพิ่ม ${n} รายการ`;b.disabled=!n}}
function impSave(){
 const used=new Set(S.items.concat(S.old).map(i=>i.code));let n=0,seq=1,nid=Math.max(0,...S.items.concat(S.old).map(i=>i.id))+1,last='';
 for(const r of IMP){if(!r.on||r.name.length<2)continue;
  let c=r.code;if(!c||used.has(c)){do{c='IMP-'+String(seq++).padStart(3,'0')}while(used.has(c))}used.add(c);
  let mn=+r.min,mx=+r.max;if(!(mn>=0)||r.min==='')mn=10;if(!(mx>0)||r.max==='')mx=Math.max(40,mn);if(mx<mn)mx=mn;
  const q=Math.max(0,+r.qty||0);
  S.items.push({id:nid++,code:c,name:r.name,cat:r.cat,unit:r.unit||'หน่วย',max:mx,min:mn,track:false,b:q?[B('-',null,q)]:[]});last=r.cat;n++}
 if(!n)return toast('ยังไม่ได้เลือกรายการ');
 MC=last||MC;closeSh();render();toast(`เพิ่ม ${n} รายการเข้าหมวดแล้ว ✓`)}
async function impFile(inp){
 const f=inp.files&&inp.files[0];inp.value='';if(!f)return;toast('กำลังอ่านไฟล์…');
 try{let txt;
  if(/\.xlsx?$/i.test(f.name)){
   if(!window.XLSX)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
   const wb=XLSX.read(await f.arrayBuffer());txt=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:'\t'})}
  else{const buf=await f.arrayBuffer();txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('\uFFFD')){try{txt=new TextDecoder('windows-874').decode(buf)}catch(e){}}txt=txt.replace(/^\uFEFF/,'')}
  impOpen(impParse(txt,false),'ไฟล์ '+clean(f.name))
 }catch(e){toast('อ่านไฟล์ไม่สำเร็จ (Excel ต้องต่อเน็ตครั้งแรก) ลองบันทึกเป็น CSV')}}
function impPrep(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const m=1800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};im.onerror=()=>no(new Error('img'));im.src=u})}
async function impImg(inp){
 const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
 if(!navigator.onLine)return toast('อ่านข้อความจากรูปต้องต่ออินเทอร์เน็ต');
 sheet('<h2>🔍 กำลังอ่านข้อความจากรูป</h2><div class="bar"><i id="ocb" style="width:4%"></i></div><p class="mu" id="oct">กำลังเตรียม… ครั้งแรกจะโหลดข้อมูลภาษาไทย อาจใช้เวลาสักครู่</p>');
 try{
  if(!window.Tesseract)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
  const cv=await impPrep(f);
  const r=await Tesseract.recognize(cv,'tha+eng',{logger:m=>{const b=$('#ocb');if(b&&m.progress!=null){b.style.width=Math.max(4,Math.round(m.progress*100))+'%';const t=$('#oct');if(t)t.textContent=m.status==='recognizing text'?'กำลังอ่านข้อความ '+Math.round(m.progress*100)+'%':'กำลังโหลดข้อมูล…'}}});
  impOpen(impParse(r.data.text||'',true),'รูปภาพ')
 }catch(e){closeSh();toast('อ่านรูปไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')}}
function impSample(){
 const t='\uFEFFชื่อรายการ,รหัส,หน่วย,หมวด,Min,Max,จำนวน\nกระดาษ A4,,รีม,สำนักงาน,5,20,12\nปากกาลูกลื่นสีน้ำเงิน,,ด้าม,สำนักงาน,20,100,50\nสบู่เหลวล้างมือ,,ขวด,งานบ้าน,3,12,6\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='ตัวอย่างนำเข้าพัสดุ.csv';document.body.appendChild(a);a.click();a.remove()}
/* ===== PWA: ติดตั้งลงหน้าจอหลัก + แจ้งเตือนอัพเดทออนไลน์ ===== */
const APP_VER='1.3.0';
let PW={dip:null,reg:null,upd:false,reload:false};
const pwLS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const pwStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pwIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pwHidden=()=>Date.now()-(+pwLS.g('ws_inst_hide')||0)<7*864e5;
function pwUI(){
 const b=document.getElementById('pwa');if(!b)return;
 if(PW.upd){b.className='pw up';b.hidden=false;b.innerHTML='<span>🔄 มีเวอร์ชันใหม่พร้อมใช้งาน ข้อมูลของคุณจะไม่หาย</span><button class="btn" onclick="pwApply()">อัพเดทเลย</button>';return}
 if(!pwStandalone()&&!pwHidden()&&(PW.dip||pwIOS())){b.className='pw';b.hidden=false;b.innerHTML='<span>📲 ติดตั้งแอปลงหน้าจอหลัก ใช้งานได้เหมือนแอปทั่วไป</span><button class="btn" onclick="pwInstall()">ติดตั้ง</button><button class="x" aria-label="ปิด" onclick="pwLater()">✕</button>';return}
 b.hidden=true;b.innerHTML='';
}
function pwLater(){pwLS.s('ws_inst_hide',Date.now());pwUI()}
async function pwInstall(){
 if(PW.dip){PW.dip.prompt();try{await PW.dip.userChoice}catch(e){}PW.dip=null;pwUI();if(T==='manage')render();return}
 if(pwIOS()){sheet('<h2>ติดตั้งบน iPhone / iPad</h2><p>1. เปิดหน้านี้ด้วย <b>Safari</b><br>2. แตะปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น)<br>3. เลือก <b>เพิ่มลงหน้าจอโฮม</b><br>4. แตะ <b>เพิ่ม</b></p><button class="btn" style="width:100%" onclick="closeSh()">เข้าใจแล้ว</button>');return}
 toast('เปิดเมนูเบราว์เซอร์ แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มไปยังหน้าจอหลัก"');
}
function pwApply(){
 const w=PW.reg&&PW.reg.waiting;try{save()}catch(e){}
 if(w)w.postMessage('SKIP_WAITING');else location.reload();
}
function pwNew(){PW.upd=true;pwUI();if(T==='manage')render()}
function pwWatch(r){
 const n=r.installing;if(!n)return;
 n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)pwNew()});
}
async function pwCheck(manual){
 if(!PW.reg){if(manual)toast('เบราว์เซอร์นี้ไม่รองรับการอัพเดทอัตโนมัติ');return}
 if(!navigator.onLine){if(manual)toast('ไม่มีอินเทอร์เน็ต ตรวจสอบไม่ได้');return}
 if(manual)toast('กำลังตรวจสอบเวอร์ชันใหม่…');
 try{await PW.reg.update()}catch(e){if(manual)toast('ตรวจสอบไม่สำเร็จ ลองใหม่อีกครั้ง');return}
 if(PW.reg.waiting&&navigator.serviceWorker.controller){pwNew();return}
 if(manual)toast(PW.reg.installing?'พบเวอร์ชันใหม่ กำลังดาวน์โหลด…':'เป็นเวอร์ชันล่าสุดแล้ว ✓')
}
function pwaCard(){
 const inst=pwStandalone(),can=!inst&&(PW.dip||pwIOS());
 return `<div class="card"><b>📲 แอปและการอัพเดท</b><div class="mu" style="margin:4px 0 10px">เวอร์ชัน ${APP_VER}${inst?' · ติดตั้งบนหน้าจอหลักแล้ว ✓':''}</div><div class="row">${can?'<button class="btn" style="flex:1" onclick="pwInstall()">ติดตั้งลงหน้าจอหลัก</button>':''}<button class="btn" style="flex:1" onclick="${PW.upd?'pwApply()':'pwCheck(true)'}">${PW.upd?'🔄 อัพเดทเลย':'ตรวจสอบอัพเดท'}</button></div></div>`
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();PW.dip=e;pwUI();if(T==='manage')render()});
addEventListener('appinstalled',()=>{PW.dip=null;toast('ติดตั้งแอปเรียบร้อยแล้ว ✓');pwUI();if(T==='manage')render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||PW.reload)return;PW.reload=true;location.reload()});
 addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
   PW.reg=r;
   if(r.waiting&&navigator.serviceWorker.controller)pwNew();
   r.addEventListener('updatefound',()=>pwWatch(r));
   setInterval(()=>pwCheck(false),30*60*1000);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)pwCheck(false)});
   addEventListener('online',()=>pwCheck(false));
  }).catch(()=>{});
 });
}
pwUI();
</script>
</body>
